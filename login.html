<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoVetor - Login</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body-modern">

    <div class="login-hud animate-slide">
        <header style="text-align: center; margin-bottom: 32px;">
            <h1 style="display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 2.5rem; color: var(--text-primary); font-weight: 800; letter-spacing: -1px;">
                EcoVetor <img src="img/Mosquito.webp" alt="Ícone Mosquito" style="width: 60px; height: 50px; object-fit: contain;">
            </h1>
            <p style="color: var(--text-secondary); margin-top: 4px;">Sistema de Monitoramento de Endemias</p>
        </header>
        
        <form id="loginForm">
            <div class="input-hud-group">
                <i class="ph ph-user"></i>
                <input type="text" id="matricula" placeholder="Matrícula" required>
            </div>
            
            <div class="input-hud-group">
                <i class="ph ph-lock-key"></i>
                <input type="password" id="password" placeholder="Senha" required>
            </div>

            <div class="input-hud-group">
                <i class="ph ph-users-three"></i>
                <select id="tipoConta" required style="width:100%; background: transparent; border:none; color:inherit; outline:none; padding-left:5px;">
                    <option value="" disabled selected hidden>Acessar como...</option>
                    <option value="agente" style="background:#222; color:#fff;">Agente de Saúde</option>
                    <option value="secretario" style="background:#222; color:#fff;">Secretário de Saúde</option>
                </select>
            </div>

            <div class="hud-options">
                <label class="remember-me">
                    <input type="checkbox" id="lembrar">
                    <span>Lembrar de mim</span>
                </label>
                <a href="#" class="forgot-password">Esqueceu a senha?</a>
            </div>
            
            <button type="submit" class="btn-hud btn-pulse">Entrar</button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.95rem;">
            <span style="color: var(--text-secondary);">Não tem uma conta?</span> 
            <a href="cadastro.html" style="color: var(--primary); font-weight: 700; text-decoration: none; margin-left: 4px;">Cadastre-se.</a>
        </div>
    </div>

    <script type="module">
        import { login } from './js/auth.js';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const matricula = document.getElementById('matricula').value;
            const password = document.getElementById('password').value;
            const tipo = document.getElementById('tipoConta').value; // Pegando o tipo!

            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "Entrando...";
            btn.disabled = true;
            
            try {
                // Passando os 3 parâmetros conforme seu auth.js exige
                await login(matricula, password, tipo);
            } catch(error) {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
