<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoVetor - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container animate-slide" style="padding-top: 60px;">
        <header style="text-align: center; margin-bottom: 32px;">
            <h1 style="font-size: 2.5rem; color: var(--primary); font-weight: 800; letter-spacing: -1px;">EcoVetor 🦟</h1>
            <p style="color: var(--text-secondary); margin-top: 4px;">Sistema de Monitoramento de Endemias</p>
        </header>
        
        <div class="card" style="padding: 24px;">
            <p style="margin-bottom: 20px; font-weight: 600; font-size: 1.1rem; text-align: center; color: var(--text-primary);">
                Acesse sua Conta
            </p>
            
            <form id="loginForm">
                <div class="input-group" style="margin-bottom: 16px;">
                    <input type="text" id="matricula" placeholder="Matrícula" required>
                </div>
                
                <div class="input-group" style="margin-bottom: 24px;">
                    <input type="password" id="password" placeholder="Senha" required>
                </div>
                
                <button type="submit" class="btn-primary btn-pulse">Entrar no Painel</button>
            </form>
        </div>

        <div style="text-align: center; margin-top: 24px; font-size: 0.95rem;">
            <span style="color: var(--text-secondary);">Não possui acesso?</span> 
            <a href="cadastro.html" style="color: var(--primary); font-weight: 700; text-decoration: none; margin-left: 4px;">Cadastre-se</a>
        </div>
    </div>

    <script type="module">
        import { login } from './js/auth.js';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const matricula = document.getElementById('matricula').value;
            const password = document.getElementById('password').value;
            await login(matricula, password);
        });
    </script>
</body>
</html>
