<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoVetor - Login</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body-modern">

    <div class="login-hud animate-slide">
        <header style="text-align: center; margin-bottom: 32px;">
            <h1 style="display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 2.5rem; color: var(--text-primary); font-weight: 800; letter-spacing: -1px;">
                EcoVetor <img src="img/Mosquito.webp" alt="Ícone Mosquito" style="width: 60px; height: 50px; object-fit: contain;">
            </h1>
            <p style="color: var(--text-secondary); margin-top: 4px;">Sistema de Monitoramento de Endemias</p>
        </header>
        
        <form id="loginForm">
            <div class="input-hud-group">
                <i class="ph ph-user"></i>
                <input type="text" id="matricula" placeholder="Matrícula" required>
            </div>
            
            <div class="input-hud-group">
                <i class="ph ph-lock-key"></i>
                <input type="password" id="password" placeholder="Senha" required>
            </div>

      <p style="color: var(--text-secondary); margin-bottom: 10px; font-weight: 600; font-size: 0.9rem; padding-left: 4px;">Entrar como:</p>
<div class="role-selector-container">
    <button type="button" class="role-btn btn-agente active" data-value="agente">
        <i class="ph ph-shield-checkered"></i>
        Agente de Saúde
    </button>
    <button type="button" class="role-btn btn-secretario" data-value="secretario">
        <i class="ph ph-briefcase"></i>
        Secretário
    </button>
</div>

<input type="hidden" id="tipoConta" value="agente">

            <div class="hud-options">
                <label class="remember-me">
                    <input type="checkbox" id="lembrar">
                    <span>Lembrar de mim</span>
                </label>
                <a href="#" class="forgot-password">Esqueceu a senha?</a>
            </div>
            
            <button type="submit" class="btn-hud btn-pulse">Entrar</button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.95rem;">
            <span style="color: var(--text-secondary);">Não tem uma conta?</span> 
            <a href="cadastro.html" style="color: var(--primary); font-weight: 700; text-decoration: none; margin-left: 4px;">Cadastre-se.</a>
        </div>
    </div>

    <script type="module">
        import { login } from './js/auth.js';

       // Lógica de alternância dos botões de tipo de conta
const roleButtons = document.querySelectorAll('.role-btn');
const tipoContaInput = document.getElementById('tipoConta');

roleButtons.forEach(btn => {
    btn.addEventListener('click', () => {
        // Remove a classe active de todos os botões
        roleButtons.forEach(b => b.classList.remove('active'));
        // Adiciona a classe active apenas no botão clicado
        btn.classList.add('active');
        // Atualiza o valor do input oculto para o formulário enviar corretamente
        tipoContaInput.value = btn.dataset.value;
    });
});
    </script>
</body>
</html>
