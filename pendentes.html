<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendências de Sincronização | EcoVetor</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <header style="margin-bottom: 28px; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <a href="index.html" style="color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; font-weight: 600;">&larr; Voltar ao Início</a>
                <h2 style="margin-top: 6px; font-size: 1.6rem; color: var(--text-primary);">Registros Pendentes</h2>
            </div>
            <button onclick="carregarLista()" style="background: none; border: none; color: var(--primary); font-weight: 700; cursor: pointer; font-size: 0.95rem;">Atualizar Lista</button>
        </header>

        <div id="lista-pendentes"></div>

        <button id="btn-sync" class="btn-primary" onclick="sincronizar()" style="margin-top: 24px;">Sincronizar com Servidor</button>
    </div>

    <script type="module">
        import { localDB } from './js/db.js';

        async function carregarLista() {
            const items = await localDB.list();
            const container = document.getElementById('lista-pendentes');
            
            if(items.length === 0) {
                container.innerHTML = `<div class="card" style="text-align: center; color: var(--text-secondary);">Nenhum registro pendente de envio.</div>`;
                return;
            }

            container.innerHTML = items.map(v => {
                const dataRegistro = new Date(v.registrado_em);
                return `
                <div class="card" style="padding: 16px; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <span style="font-weight: 700; font-size: 0.95rem; text-transform: uppercase; color: var(--text-primary);">${v.status}</span>
                    </div>
                    <div style="text-align: right;">
                        <small style="color: var(--text-secondary); display: block;">${dataRegistro.toLocaleDateString()}</small>
                        <small style="color: var(--text-muted); font-size: 0.8rem;">${dataRegistro.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</small>
                    </div>
                </div>`;
            }).join('');
        }

        window.sincronizar = async () => {
            const btn = document.getElementById('btn-sync');
            btn.innerHTML = "Processando Sincronização...";
            btn.style.opacity = "0.7";
            btn.style.pointerEvents = "none";
            
            try {
                // Simulação da chamada de API
                await new Promise(resolve => setTimeout(resolve, 1500));
                await localDB.clear(); 
                
                alert("Sincronização realizada com sucesso.");
                carregarLista();
            } catch(e) {
                alert("Falha de conexão. Verifique os parâmetros de rede e tente novamente.");
            } finally {
                btn.innerHTML = "Sincronizar com Servidor";
                btn.style.opacity = "1";
                btn.style.pointerEvents = "auto";
            }
        };

        carregarLista();
    </script>
</body>
</html>
