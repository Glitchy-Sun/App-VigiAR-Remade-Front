<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VigiAr - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

    <div class="login-container">
        <h1 class="logo-title">VigiAr</h1>
        
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="matricula" placeholder="Matrícula" required>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder="Senha" required>
            </div>
            
            <button type="submit" class="btn-primary">Entrar</button>
        </form>

        <div class="auth-link" style="margin-top: 15px;">
            Não possui acesso? <a href="cadastro.html">Cadastre-se</a>
        </div>
    </div>

    <script type="module">
        import { login } from './js/auth.js'; // Ajuste o caminho se seu auth.js estiver em outra pasta

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const matricula = document.getElementById('matricula').value;
            const password = document.getElementById('password').value;
            
            // Chama a função real de login
            await login(matricula, password);
        });
    </script>
</body>
</html>
