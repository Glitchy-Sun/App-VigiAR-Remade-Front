<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoVetor - Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container animate-slide" style="padding-top: 40px;">
        <header style="margin-bottom: 24px;">
            <a href="login.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 600; font-size: 0.95rem;">&larr; Voltar para o Login</a>
            <h2 style="margin-top: 10px; font-size: 1.6rem; font-weight: 700;">Criar Conta</h2>
        </header>
        
        <div class="card" style="padding: 24px;">
            <p style="margin-bottom: 20px; font-weight: 600; font-size: 1.1rem; color: var(--text-primary);">
                Preencha as suas informações
            </p>
            
            <form id="cadastroForm">
                <div class="input-group" style="margin-bottom: 16px;">
                    <input type="text" id="nome" placeholder="Nome Completo" required>
                </div>

                <div class="input-group" style="margin-bottom: 16px;">
                    <input type="text" id="matricula" placeholder="Matrícula" required>
                </div>
                
                <div class="input-group" style="margin-bottom: 24px;">
                    <input type="password" id="password" placeholder="Crie uma senha" required>
                </div>
                
                <button type="submit" class="btn-primary btn-pulse">Finalizar Cadastro</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { register } from './js/auth.js'; 
        
        document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dados = {
                nome: document.getElementById('nome').value,
                matricula: document.getElementById('matricula').value,
                password: document.getElementById('password').value
            };
            await register(dados);
        });
    </script>
</body>
</html>
