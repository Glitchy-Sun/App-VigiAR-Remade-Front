<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VigiAr - Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

    <div class="login-container">
        <h1 class="logo-title">Criar Conta</h1>
        
        <form id="cadastroForm">
            <div class="input-group">
                <input type="text" id="nome" placeholder="Nome Completo" required>
            </div>

            <div class="input-group">
                <input type="text" id="matricula" placeholder="Matrícula" required>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder="Crie uma senha" required>
            </div>
            
            <button type="submit" class="btn-primary">Cadastrar</button>
        </form>

        <div class="auth-link" style="margin-top: 15px;">
            Já possui uma conta? <a href="login.html">Faça Login</a>
        </div>
    </div>

    <script type="module">
        import { register } from './js/auth.js'; 
        import { login } from './js/auth.js';
        document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dados = {
                nome: document.getElementById('nome').value,
                matricula: document.getElementById('matricula').value,
                password: document.getElementById('password').value
            };
            
            await register(dados);
        });
    </script>
</body>
</html>
