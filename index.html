<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VigiAr - Dashboard</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="css/styles.css">

    <style>
        /* É obrigatório dar altura ao mapa, senão ele fica invisível */
        #map { 
            height: 500px; 
            width: 100%; 
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">VigiAr</div>
        <div class="navbar-menu">
            <a href="index.html" class="active">Home</a>
            <a href="login.html" class="logout-link">Sair</a>
        </div>
    </nav>

    <main class="main-content" style="padding: 20px;">
        <h2>Monitoramento de Endemias</h2>
        <p>Visualização em tempo real dos focos.</p>

        <div id="map"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    
    <script>
        if (!localStorage.getItem('vigiar.user')) {
        window.location.href = 'login.html';}
        // 1. Inicializa o mapa com coordenadas centrais (Exemplo: Recife)
        const map = L.map('map').setView([-8.0584, -34.8848], 13);

        // 2. Adiciona a camada de mapa do OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 3. Exemplo de como adicionar um marcador (pode ser dinâmico depois)
        L.marker([-8.0584, -34.8848]).addTo(map)
            .bindPopup('Ponto de monitoramento ativo.')
            .openPopup();
    </script>
    <script type="module">
    import { syncData } from './js/sync.js';
    import { network } from './js/network.js';

    // Tentar sincronizar quando a internet voltar
    network.onReconnect(() => {
        console.log("Internet detectada, sincronizando...");
        syncData();
    });

    // Tentar sincronizar ao carregar a página
    syncData();
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
