<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Secretário | EcoVetor</title>
    
    <!-- DEPENDÊNCIAS DO LEAFLET MAPS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .profile-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #00d2c4; }
        .form-secretario { display: flex; gap: 15px; background: var(--card); padding: 20px; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 25px; flex-wrap: wrap; }
        .form-secretario input { flex: 1; min-width: 200px; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color:#fff; border-radius:6px; }
    </style>
</head>
<body>

    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo" style="display:flex; flex-direction:column; align-items:center; gap:10px;">
                <img id="user-avatar" class="profile-img" src="img/default-user.png" alt="Avatar">
                <span id="user-welcome" style="font-size: 0.95rem; font-weight:600;">Secretário(a) de Saúde</span>
            </div>
            <nav class="sidebar-nav">
                <a href="secretario.html" class="active"><i class="ph ph-squares-four"></i> Painel Geral</a>
                <a href="#" id="btn-logout" style="margin-top:auto; color:#ff4d4d;"><i class="ph ph-sign-out"></i> Sair</a>
            </nav>
        </aside>

        <main class="main-content">
            <h2>Painel de Gestão do(a) Secretário(a)</h2>
            
            <!-- Formulário de Atribuição -->
            <form id="formDesignar" class="form-secretario">
                <input type="text" id="agenteMatricula" placeholder="Matrícula do Agente" required>
                <input type="text" id="tarefaDescricao" placeholder="Afazer / Descrição da Visita" required>
                <input type="text" id="horarioInicio" placeholder="Horário de Início (Ex: 14:00)" required>
                <button type="submit" class="btn-hud" style="background:#00d2c4; min-width:150px;">Atribuir Tarefa</button>
            </form>

            <!-- Tabela de Acompanhamento -->
            <div class="table-card" style="margin-bottom: 25px;">
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px;">
                    <h3 style="margin: 0;">Status de Todas as Visitas e Afazeres Designados</h3>
                    <button id="btn-refresh" class="refresh-btn">Atualizar Painel</button>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>MATRÍCULA AGENTE</th>
                                <th>AFAZER / VISITA</th>
                                <th>HORÁRIO DE INÍCIO</th>
                                <th>STATUS DO CUMPRIMENTO</th>
                            </tr>
                        </thead>
                        <tbody id="lista-controle-secretario">
                            <tr><td colspan="4" style="text-align:center;">Carregando informações do servidor...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- CARD DO MAPA DE CALOR (AGORA COM ROLAGEM CORRETA E ALTURA AMPLA) -->
            <div class="table-card" style="padding: 0; display: flex; flex-direction: column;">
                <div style="padding: 15px 20px; border-bottom: 1px solid var(--border);">
                    <h3 style="margin: 0; font-size: 1.1rem;">Distribuição Territorial e Mapa de Calor de Focos</h3>
                </div>
                <div id="map"></div>
            </div>
        </main>
    </div>

    <!-- SCRIPTS CORE DO LEAFLET E MAPA TÉRMICO -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    
    <!-- ARQUIVO DE LÓGICA DO MAPA -->
    <script src="js/mapa.js"></script>

    <!-- LOGICA DE AGENDAMENTOS E CONTROLE DO PAINEL -->
    <script type="module">
        import { checkAuth } from './js/auth.js';
        import { CONFIG } from './js/config.js';

        const user = checkAuth('secretario');
        if (user) {
            document.getElementById('user-welcome').innerText = user.nome;
            if (user.foto_base64) {
                document.getElementById('user-avatar').src = user.foto_base64;
            }
        }

        document.getElementById('btn-logout').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = 'login.html';
        });

        const form = document.getElementById('formDesignar');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                matricula_agente: document.getElementById('agenteMatricula').value,
                afazer: document.getElementById('tarefaDescricao').value,
                horario: document.getElementById('horarioInicio').value
            };

            try {
                const response = await fetch(`${CONFIG.API_URL}/agendamentos/criar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if(!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || "Erro ao delegar tarefa.");
                }

                alert("Tarefa designada e enviada com sucesso para a agenda do agente!");
                form.reset();
                carregarQuadroGeral();
            } catch(err) {
                alert(err.message);
            }
        });

        async function carregarQuadroGeral() {
            try {
                const r = await fetch(`${CONFIG.API_URL}/agendamentos/todos`);
                const dados = await r.json();
                const tbody = document.getElementById('lista-controle-secretario');
                tbody.innerHTML = "";

                if(dados.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--text-secondary);">Nenhuma tarefa cadastrada no sistema.</td></tr>`;
                    return;
                }

                dados.forEach(item => {
                    const tr = document.createElement('tr');
                    const statusClass = item.status === 'concluido' ? 'status-valido' : 'status-analise';
                    
                    tr.innerHTML = `
                        <td><span style="font-family: monospace; font-weight:700;">${item.matricula_agente}</span></td>
                        <td>${item.afazer}</td>
                        <td>${item.horario}</td>
                        <td><span class="badge-status ${statusClass}">${item.status === 'concluido' ? 'CONCLUÍDA' : 'PENDENTE'}</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch(e) {
                console.error("Erro ao ler quadro:", e);
            }
        }

        document.getElementById('btn-refresh').addEventListener('click', carregarQuadroGeral);
        
        setInterval(carregarQuadroGeral, 10000);
        carregarQuadroGeral();
    </script>
</body>
</html>
