<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VigiAr - Cadastro</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body">

    <div class="login-container">
        <h1 class="logo-title">Criar Conta</h1>
        
        <form id="cadastroForm">
            <div class="input-group">
                <input type="text" id="nome" placeholder="Nome Completo" required>
            </div>

            <div class="input-group">
                <input type="text" id="matricula" placeholder="Matrícula (Ex: ACE001)" required>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder="Crie uma senha" required>
            </div>
            
            <button type="submit" class="btn-primary">Cadastrar</button>
        </form>

        <div class="auth-link">
            Já possui uma conta? <a href="login.html">Faça Login</a>
        </div>
    </div>

    <script>
        document.getElementById('cadastroForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            alert("Conta criada com sucesso! Redirecionando para o login...");
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
