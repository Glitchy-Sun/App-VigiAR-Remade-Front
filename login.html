<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoVetor - Login</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body-modern">

    <div class="login-hud animate-slide">
        <header style="text-align: center; margin-bottom: 32px;">
            <h1 style="font-size: 2.5rem; color: var(--text-primary); font-weight: 800; letter-spacing: -1px;">EcoVetor 🦟</h1>
            <p style="color: var(--text-secondary); margin-top: 4px;">Sistema de Monitoramento de Endemias</p>
        </header>
        
        <form id="loginForm">
            <div class="input-hud-group">
                <i class="ph ph-user"></i>
                <input type="text" id="matricula" placeholder="Matrícula" required>
            </div>
            
            <div class="input-hud-group">
                <i class="ph ph-lock-key"></i>
                <input type="password" id="password" placeholder="Senha" required>
            </div>

            <div class="hud-options">
                <label class="remember-me">
                    <input type="checkbox" id="lembrar">
                    <span>Lembrar de mim</span>
                </label>
                <a href="#" class="forgot-password">Esqueceu a senha?</a>
            </div>
            
            <button type="submit" class="btn-hud btn-pulse">Entrar</button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.95rem;">
            <span style="color: var(--text-secondary);">Não tem uma conta?</span> 
            <a href="#" style="color: var(--primary); font-weight: 700; text-decoration: none; margin-left: 4px;">Cadastre-se.</a>
        </div>
    </div>

    <script type="module">
        import { login } from './js/auth.js';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const matricula = document.getElementById('matricula').value;
            const password = document.getElementById('password').value;

            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "Entrando...";
            
            try {
                await login(matricula, password);
            } catch(error) {
                // O erro já será exibido pelo alert no auth.js
                btn.innerText = originalText;
            }
        });
    </script>
</body>
</html>
