<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoVetor - Cadastro</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body-modern">

    <div class="login-hud animate-slide">
        <header style="text-align: center; margin-bottom: 32px;">
            <h1 style="display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 2.5rem; color: var(--text-primary); font-weight: 800; letter-spacing: -1px;">
                EcoVetor <img src="img/Mosquito.webp" alt="Ícone Mosquito" style="width: 60px; height: 50px; object-fit: contain;">
            </h1>
            <p style="color: var(--text-secondary); margin-top: 4px;">Cadastro de Agentes</p>
        </header>
        
        <form id="cadastroForm">
            <div class="input-hud-group">
                <i class="ph ph-user"></i>
                <input type="text" id="nome" placeholder="Nome Completo" required>
            </div>

            <div class="input-hud-group">
                <i class="ph ph-identification-card"></i>
                <input type="text" id="matricula" placeholder="Matrícula" required>
            </div>
            
            <div class="input-hud-group">
                <i class="ph ph-lock-key"></i>
                <input type="password" id="password" placeholder="Crie uma senha" required>
            </div>
            
            <button type="submit" class="btn-hud btn-pulse">Finalizar Cadastro</button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.95rem;">
            <a href="login.html" style="color: var(--text-secondary); font-weight: 600; text-decoration: none;">&larr; Voltar para o Login</a>
        </div>
    </div>

    <script type="module">
        import { register } from './js/auth.js'; 
        
        document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dados = {
                nome: document.getElementById('nome').value,
                matricula: document.getElementById('matricula').value,
                password: document.getElementById('password').value
            };
            
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "Cadastrando...";
            
            try {
                await register(dados);
            } catch(error) {
                btn.innerText = originalText;
            }
        });
    </script>
</body>
</html>
