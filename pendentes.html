<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registros Pendentes | EcoVetor</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* === CUSTOMIZAÇÃO DO HUD DE PENDÊNCIAS (MODO ESCURO SEGURO) === */
        
        /* Ajusta o miolo do card para não herdar o branco do tema claro */
        .pendentes-dark-theme .table-card {
            background-color: #1e293b !important; 
            border-color: #334155 !important;
        }

        /* Deixa o topo (cabeçalho) totalmente preto */
        .pendentes-dark-theme .sync-table thead tr {
            background-color: #000000 !important;
        }
        .pendentes-dark-theme .sync-table th {
            background-color: #000000 !important;
            color: #2dd4bf !important;
            border-bottom: 1px solid #334155 !important;
        }

        /* Deixa a linha de dados com fundo condizente ao modo escuro */
        .pendentes-dark-theme .sync-table td {
            background-color: #1e293b !important;
            color: #cbd5e1 !important;
            border-bottom: 1px solid #334155 !important;
        }

        /* Deixa o rodapé da sincronização totalmente preto */
        .pendentes-dark-theme .sync-footer {
            background-color: #000000 !important;
            border-top: 1px solid #334155 !important;
        }

        /* === DESIGN DOS BOTÕES DE AÇÃO (LUPA E LIXEIRA) === */
        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            background: none;
            border: none;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s ease;
        }

        /* Estilização da Lupa (Visualizar) */
        .btn-icon.view {
            color: #2dd4bf;
            background-color: rgba(45, 212, 191, 0.1);
        }
        .btn-icon.view:hover {
            background-color: rgba(45, 212, 191, 0.25);
            transform: translateY(-1px);
        }

        /* Estilização da Lixeira (Excluir) */
        .btn-icon.delete {
            color: #f87171;
            background-color: rgba(248, 113, 113, 0.1);
        }
        .btn-icon.delete:hover {
            background-color: rgba(248, 113, 113, 0.25);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="pendentes-dark-theme">

    <div class="sync-wrapper animate-slide">
        <header class="sync-header">
            <a href="index.html" class="back-link"><i class="ph ph-arrow-left"></i> Voltar ao Início</a>
            <button onclick="carregarLista()" class="refresh-btn">Atualizar Lista</button>
        </header>
        
        <h2 class="sync-title">Registros Pendentes</h2>

        <div class="table-card">
            <div class="table-responsive">
                <table class="sync-table">
                    <thead>
                        <tr>
                            <th>DATA</th>
                            <th>HORA</th>
                            <th>LOCALIZAÇÃO</th>
                            <th>INDÍCIOS DE DENGUE</th>
                            <th>STATUS</th>
                            <th>AÇÕES</th>
                        </tr>
                    </thead>
                    <tbody id="lista-pendentes">
                        <!-- O JavaScript preencherá as linhas aqui -->
                    </tbody>
                </table>
            </div>
            
            <div class="sync-footer">
                <button id="btn-sync" class="btn-sync-server" onclick="sincronizar()">Sincronizar com Servidor</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { localDB } from './js/db.js';

        // Armazena a lista na memória para as funções de clique acessarem
        window.registrosGlobais = [];

        window.carregarLista = async () => {
            let items = await localDB.list();
            window.registrosGlobais = items; 
            const container = document.getElementById('lista-pendentes');
            
            // Layout de vazio caso não tenha registros
            if(items.length === 0) {
                container.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #94a3b8; padding: 40px; background-color: #1e293b;">Nenhum registro pendente para sincronização.</td></tr>`;
                return;
            }

            container.innerHTML = items.map((v, index) => {
                const dataRegistro = new Date(v.registrado_em);
                const dataFormatada = dataRegistro.toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit', year: 'numeric'});
                const horaFormatada = dataRegistro.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
                const endereco = v.endereco || v.setor_manual || "Localização GPS";
                
                let indiciosHtml = "";
                if (v.status && v.status.toUpperCase() === "FECHADA") {
                    indiciosHtml = `<span class="badge-house-closed"><i class="ph ph-door-bold"></i> Residência Fechada</span>`;
                } else {
                    const qtd = v.focos ? v.focos.length : 0;
                    if (qtd === 0) {
                        indiciosHtml = `<span style="color: #94a3b8;"><i class="ph ph-check-circle" style="color: #10b981;"></i> Nenhum indício</span>`;
                    } else {
                        indiciosHtml = `<span style="color: #fca5a5; font-weight: 600;"><i class="ph ph-warning-circle"></i> ${qtd} indício(s) encontrado(s)</span>`;
                    }
                }

                return `
                <tr>
                    <td>${dataFormatada}</td>
                    <td>${horaFormatada}</td>
                    <td>${endereco} <i class="ph ph-map-pin" style="color: #64748b; margin-left: 4px;"></i></td>
                    <td>${indiciosHtml}</td>
                    <td><span class="status-waiting"><i class="ph ph-clock"></i> Aguardando Sinc.</span></td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn-icon view" title="Visualizar" onclick="verRegistro(${index})"><i class="ph ph-magnifying-glass"></i></button>
                            <button class="btn-icon delete" title="Excluir" onclick="excluirRegistro(${index})"><i class="ph ph-trash"></i></button>
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }

        // --- Função LUPA (Visualizar) ---
        window.verRegistro = (index) => {
            const reg = window.registrosGlobais[index];
            if (!reg) return;
            
            const focos = (reg.focos && reg.focos.length > 0) ? reg.focos.join(', ').toUpperCase() : 'NENHUM';
            const status = reg.status ? reg.status.toUpperCase() : 'NÃO INFORMADO';
            const obs = reg.observacoes || 'Nenhuma observação informada';
            
            alert(`🔍 DETALHES DA VISITA:\n\nStatus: ${status}\nFocos Assinalados: ${focos}\nObservações: ${obs}`);
        };

        // --- Função LIXEIRA (Excluir Atualizada) ---
        window.excluirRegistro = async (index) => {
            const reg = window.registrosGlobais[index];
            if (!reg) return;

            if (confirm("Tem certeza que deseja excluir permanentemente este registro pendente?")) {
                try {
                    // Tratamento dinâmico baseado na estrutura do seu db.js para garantir a exclusão física do item
                    if (typeof localDB.delete === 'function') {
                        // Tenta deletar usando a chave ID do IndexedDB/Objeto ou a própria posição se for array
                        await localDB.delete(reg.id !== undefined ? reg.id : index);
                    } else if (typeof localDB.remove === 'function') {
                        await localDB.remove(reg.id !== undefined ? reg.id : index);
                    } else {
                        // Caso seu db.js use uma estratégia de manipulação direta do array em cache
                        throw new Error("Método de exclusão não mapeado no localDB.");
                    }
                    
                    alert("Registro removido com sucesso!");
                    // Atualiza a tabela imediatamente após apagar do IndexedDB/Cache
                    await window.carregarLista();
                } catch(e) {
                    alert("Erro ao tentar excluir o registro do banco de dados local.");
                    console.error(e);
                }
            }
        };

        window.sincronizar = async () => {
            const btn = document.getElementById('btn-sync');
            btn.innerHTML = "Processando Sincronização...";
            btn.classList.add("processing");
            
            try {
                await new Promise(resolve => setTimeout(resolve, 2000));
                await localDB.clear(); 
                alert("Sincronização realizada com sucesso!");
                carregarLista(); 
            } catch(e) {
                alert("Falha de conexão. Verifique sua rede.");
            } finally {
                btn.innerHTML = "Sincronizar com Servidor";
                btn.classList.remove("processing");
            }
        };

        carregarLista();
    </script>
</body>
</html>
