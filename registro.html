<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Registro - VigiAr</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container animate-slide">
        <header style="margin-bottom: 24px;">
            <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-weight: 600;">&larr; Voltar</a>
            <h2 style="margin-top: 10px;">Nova Visita 📝</h2>
        </header>

        <div id="step-status" class="step active">
            <div class="card">
                <p style="margin-bottom: 16px; font-weight: 600;">Qual o status desta visita?</p>
                <div class="grid-select">
                    <div class="chip" onclick="avancar('visitada')">
                        <span class="emoji">✅</span> Aberta/Visitada
                    </div>
                    <div class="chip" onclick="avancar('fechada')">
                        <span class="emoji">🔒</span> Fechada/Recusada
                    </div>
                </div>
            </div>
        </div>

        <div id="step-focos" class="step">
            <div class="card">
                <p style="margin-bottom: 16px; font-weight: 600;">🦟 Algum foco encontrado?</p>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: -10px; margin-bottom: 15px;">Selecione os focos ou clique em "Continuar" se não houver nenhum.</p>
                
                <div class="grid-select">
                    <div class="chip" onclick="toggleFoco(this, 'pneu')"><span class="emoji">🛞</span> Pneu</div>
                    <div class="chip" onclick="toggleFoco(this, 'lixo')"><span class="emoji">🗑️</span> Lixo/Entulho</div>
                    <div class="chip" onclick="toggleFoco(this, 'vaso')"><span class="emoji">🪴</span> Vaso/Planta</div>
                    <div class="chip" onclick="toggleFoco(this, 'calha')"><span class="emoji">🏠</span> Calha</div>
                    <div class="chip" onclick="toggleFoco(this, 'caixa_dagua')"><span class="emoji">💧</span> Caixa d'água</div>
                    <div class="chip" onclick="toggleFoco(this, 'piscina')"><span class="emoji">🏊</span> Piscina</div>
                    <div class="chip" onclick="toggleFoco(this, 'outros')"><span class="emoji">❓</span> Outros</div>
                </div>
                <button class="btn-primary" onclick="irParaLocalizacao()" style="margin-top: 20px;">Continuar &rarr;</button>
